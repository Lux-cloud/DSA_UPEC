table_name: sor_count_vs_amau
main_dttm_col: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: default
schema: default
sql: "SELECT \n  `sor_count`.`platform_name` AS `platform_name`,\n  `sor_count`.`SUM(count)`\
  \ AS `SUM(count)`,\n  vlopses.`Average monthly active users in millions` * 1e6 AS\
  \ AMAU,\n  `sor_count`.`SUM(count)` / `sor_count`.days_active * 30 / (vlopses.`Average\
  \ monthly active users in millions` * 1e6) AS `sor_per_amau`\nFROM (\n  SELECT `platform_name`\
  \ AS `platform_name`,\n         sum(`count`) AS `SUM(count)`,\n         datediff(max(created_at),\
  \ min(created_at)) AS days_active\n  FROM\n    (SELECT *\n     FROM parquet.`/data/tdb_data/global___full/aggregations/aggregated-complete.parquet/`)\
  \ AS `virtual_table`\n  GROUP BY `platform_name`\n  ORDER BY `SUM(count)` DESC\n\
  \  LIMIT 100\n) AS sor_count\nJOIN\n(SELECT * FROM parquet.`/data/vlopses.parquet`)\
  \ AS vlopses\nON vlopses.`Designated service` = sor_count.platform_name;"
