# Description: Configuration file for the aggregation script

# input_format: the format of the input files.
# It can be either "parquet" or "csv"
input_format: "parquet"

# output_format: the format of the output file.
# It can be either "parquet", "pickle" or "csv"
output_format: "parquet"

# write mode: the mode to use when writing the output file.
# It can be either "overwrite" or "append"
# If append is used, the output file specified in the cli or
# function parameters should already exist alongside with the
# dates auxiliary file. If the aggregated file and/or the
# dates auxiliary file do not exist, the script will aggregate
# all the data from scratch and create the files.
write_mode: "append"

# Whether or not to delete the original columns when the data
# is horizontally exploded
delete_original_columns: true

# Whether or not to horizontally explode the columns
# This means that every column that contains a list of values
# will be exploded into multiple columns, one for each value
# in the list. Each of these columns will contain a boolean
# value indicating whether or not the value is present in the
# original list.
horizontally_explode_columns: true

# Whether or not changing values of a given platform_name should
# be coalesced to a single platform_name or not.
normalize_platform_name: true

# The value to use to fill the columns that are exploded
# with string and boolean
fillna_str_value: null
fillna_bool_value: false

# Compute the time to action and report for each group
compute_time_to_action: false

# Compute the restriction duration time for each group
# Precedence is (first defined is used) :
# visibility restriction > account restriction >
# service restriction > monetary restriction.
compute_restriction_duration: true

# The dates to use to filter the data based on the content,
# decision and created_at (upload to the DB) dates
# Set the variable to null to disable the specific filter
content_date_range: null
  # - "2014-01-01 00:00:00"
  # - "2024-01-31 23:59:59"

decision_date_range: null
  # - "2022-01-01 00:00:00"
  # - "2024-01-31 23:59:59"

created_at_date_range: null
  # - "2022-01-01 00:00:00"
  # - "2024-01-31 23:59:59"

# The platforms to exclude.
# Leave it to null to keep all the platforms.
platforms_to_exclude: null

# The floor to use when aggregating the created_at datetime column
# The possible values are the ones in the pyspark documentation
# https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.date_trunc.html
# ‘year’, ‘yyyy’, ‘yy’ to truncate by year,
# ‘month’, ‘mon’, ‘mm’ to truncate by month,
# ‘day’, ‘dd’ to truncate by day,
# Other options are: ‘microsecond’, ‘millisecond’, ‘second’, ‘minute’, ‘hour’, ‘week’, ‘quarter’
created_at_dt_floor: "day"

# The columns to import from the input files
# Do not include here the datetime columns, they will be
# defined in the columns_datetime variable below
columns_to_import:
  - account_type
  - decision_visibility
  - decision_monetary
  - decision_provision
  - decision_account
  - platform_name
  # - platform_id
  # - content_date
  - category
  - category_addition
  - category_specification
  - decision_ground
  - territorial_scope
  - automated_decision
  - automated_detection
  # - application_date
  # - created_at
  - source_type
  - content_type
  - content_type_other
  - uuid
  - incompatible_content_illegal
  - content_language

# The additional columns to import from the input files that must be
# parsed as datetime
columns_datetime:
  - application_date
  - created_at
  - content_date
  # - end_date
  # - end_date_account_restriction
  # - end_date_service_restriction
  # - end_date_monetary_restriction
  # - end_date_visibility_restriction

