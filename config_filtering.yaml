# This is a required attribute that defines territorial scope of the restriction. Each value must be the 2-letter iso code for the country and the countries must be (EU/EEA) countries.
# The value provided must be an array.
# Allowed values are:
# AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE, IS, IT, LI, LT, LU, LV, MT, NL, NO, PL, PT, RO, SE, SI, SK
# Note that the package will automatically map:
# - To European Union ('EU'): ["AT", "BE", "BG", "CY", "CZ", "DE", "DK", "EE", "ES", "FI", "FR", "GR", "HR", "HU", "IE", "IT", "LT", "LU", "LV", "MT", "NL", "PL", "PT", "RO", "SE", "SI", "SK"]
# - To European Economic Area ('EEA'): ["AT", "BE", "BG", "CY", "CZ", "DE", "DK", "EE", "ES", "FI", "FR", "GR", "HR", "HU", "IE", "IS", "IT", "LI", "LT", "LU", "LV", "MT", "NL", "NO", "PL", "PT", "RO", "SE", "SI", "SK"]
# - To 'EEA_no_IS': ["AT", "BE", "BG", "CY", "CZ", "DE", "DK", "EE", "ES", "FI", "FR", "GR", "HR", "HU", "IE", "IT", "LI", "LT", "LU", "LV", "MT", "NL", "NO", "PL", "PT", "RO", "SE", "SI", "SK"]
territorial_scope: null

####################
# Free text fields #
####################
# For these fields, the value must be a string of text.
# If you are passing a regular expression, you must escape it and set
# the corresponding "column_to_lower" field to true.
# Leave the value to null if you do not want to filter by that field.

# This is required if DECISION_VISIBILITY_OTHER was the decision_visibility.
decision_visibility_other: null
decision_visibility_other_to_lower: false

# This is required if DECISION_MONETARY_OTHER was the decision_monetary.
decision_monetary_other: null
decision_monetary_other_to_lower: false

# This is a required textual field to describe the facts and circumstances relied on in taking the decision.
decision_facts: null
decision_facts_to_lower: false

# Optional free text fields

# This is an url to the TOS or Law relied upon in taking the decision.
# This is an optional attribute.
decision_ground_reference_url: null
decision_ground_reference_url_to_lower: false

# This is required if the DECISION_GROUND_ILLEGAL_CONTENT was the decision_ground.
# It is the legal grounds relied on.
illegal_content_legal_ground: null
illegal_content_legal_ground_to_lower: false

# This is required if the DECISION_GROUND_ILLEGAL_CONTENT was the decision_ground.
# This is a text that explains why the content was illegal.
illegal_content_explanation: null
illegal_content_explanation_to_lower: false

# This is required if DECISION_GROUND_INCOMPATIBLE_CONTENT was the decision_ground.
# It is the reference to contractual grounds.
incompatible_content_ground: null
incompatible_content_ground_to_lower: false

# This is required if DECISION_GROUND_INCOMPATIBLE_CONTENT was the decision_ground.
# This is a text that explains why the content is considered as incompatible on that ground.
incompatible_content_explanation: null
incompatible_content_explanation_to_lower: false

# This is required if CONTENT_TYPE_OTHER was the content_type.
# It is a content type that is not part of provided content type list.
content_type_other: null
content_type_other_to_lower: false

# This field can be provided if KEYWORD_OTHER is part of the category_specification.
category_specification_other: null
category_specification_other_to_lower: false

# This is an optional field to describe the source/notifier if needed.
# Will not be taken into account if the 'source_type' is set to 'SOURCE_VOLUNTARY'
source_identity: null
source_identity_to_lower: false


#####################
# Restriction dates #
#####################
# These are not implemented yet, but they are here for future use.

# The date needs to take the form of:
# YYYY-MM-DD
# The day and the month have leading zeroes.
# The date must be after or equal to the application date.

# This is the date that the decision on the account ends. Leave blank for indefinite.
end_date_account_restriction: null

# This is the date that the monetary decision ends. Leave blank for indefinite.
end_date_monetary_restriction: null

# This is the date that the provision decision ends. Leave blank for indefinite.
end_date_service_restriction: null

# This is the date that the visibility decision ends. Leave blank for indefinite.
end_date_visibility_restriction: null


